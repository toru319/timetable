<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#244b46"><title>ふたりの時間割</title><link rel="stylesheet" href="style.css"><script type="module" src="js/app.js"></script></head>
<body><main class="app"><header><div class="eyebrow">OUR CAMPUS DAYS</div><div class="heading"><div><h1>ふたりの時間割<span class="dot">.</span></h1><p>今日の授業も、いつもの予定も。</p></div><span class="brand" aria-hidden="true">▦</span></div><div class="toolbar"><div id="users" class="users" aria-label="時間割の利用者"></div><label class="semester-label">学期<select id="semester"></select></label></div></header>
<section class="overview" aria-label="時間割の概要"><div><span id="person" class="person"></span><span id="term" class="term"></span></div><div class="credit"><strong id="credits">—</strong><span>単位</span></div></section>
<p id="note" class="note" hidden></p><p id="status" role="status">時間割を読み込んでいます…</p>
<section aria-label="週間時間割"><div class="table-wrap"><table id="timetable"><thead></thead><tbody></tbody></table></div></section>
<div class="legend"><span><i class="lesson"></i>授業</span><span><i class="remote"></i>遠隔・学習予定</span><span><i class="personal"></i>個人の予定</span></div>
<section class="outside"><div class="section-heading"><h2>オンデマンド・時間外</h2><span>自分のペースで</span></div><div id="outside-list"></div></section>
<footer>科目をタップすると詳細を表示します。<br>教室変更・休講・提出期限は大学の最新案内も確認してください。</footer></main>
<dialog id="detail"><div class="dialog-head"><span class="eyebrow">CLASS DETAILS</span><button id="close" aria-label="詳細を閉じる">×</button></div><div id="detail-body"></div><button id="close-bottom" class="close-bottom">閉じる</button></dialog>
</body></html>
